services:
  - type: web
    name: the-hot-reports-backend
    runtime: python
    version: "3.13"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py setup_categories && python manage.py setup_ad_slots && python manage.py create_default_users && gunicorn pulse.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: pulse.settings
      - key: PYTHON_VERSION
        value: 3.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "the-hot-reports-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://the-hot-reports.vercel.app,https://thehotreports.vercel.app,https://thehotreports.com,https://www.thehotreports.com,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://the-hot-reports-backend.onrender.com,https://the-hot-reports.vercel.app,https://thehotreports.vercel.app,https://thehotreports.com,https://www.thehotreports.com"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SAMESITE
        value: "Lax"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"
      - key: DATABASE_URL
        value: "postgresql://admin:gDGrTnKc7y76xFF2ZL0WUyY4dU4jBNhs@dpg-d8i0jf7lk1mc73fkq9sg-a/pulse_kigezi_database"
      - key: SITE_URL
        value: "https://thehotreports.com"
      - key: BACKEND_URL
        value: "https://the-hot-reports-backend.onrender.com"
      - key: SITE_DOMAIN
        value: "thehotreports.com"
      - key: SITE_NAME
        value: "The Hot Reports"
      - key: SITE_DESCRIPTION
        value: "Nationwide news, serial stories, and travel reporting from across Uganda."
      - key: OG_IMAGE
        value: "https://thehotreports.com/og-image.png"
      - key: TWITTER_HANDLE
        value: "@thehotreports"
      - key: PULSE_VISITOR_HASH_SALT
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        value: "your-public-key"
      - key: VAPID_PRIVATE_KEY
        value: "4wf20_s7YF4teKOqbm-LzVk2ZmPpFoCWhwvTBu1taTc"
      - key: VAPID_ADMIN_EMAIL
        value: "admin@thehotreports.com"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: "thehotreports@gmail.com"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "The Hot Reports <thehotreports@gmail.com>"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        value: "pulse-of-kigezi-indexing-0d3a637a4974.json"
    disk:
      name: pulse-data
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 10

crons:
  - name: publish-scheduled-content
    schedule: "* * * * *"
    command: "python manage.py publish_scheduled"
